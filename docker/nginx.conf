# Serve the site the way Vercel does: directory URLs resolve to their
# index.html (toys/<slug>/, all-toys/<cat>/), no clean-URL rewriting.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # A request for /tools/barkeep (no slash) redirects to /tools/barkeep/.
  # Relative, so the redirect keeps whatever host:port you came in on.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/xml text/plain;
  gzip_min_length 1024;

  location / {
    try_files $uri $uri/ =404;
  }

  # Pages always revalidate; every shared asset is cache-busted with ?v=N,
  # so those can be held for a day.
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }
  location ~* \.(css|js|png|jpe?g|webp|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=86400";
  }

  # Nothing private is served, but dotfiles never are.
  location ~ /\. {
    deny all;
  }
}
