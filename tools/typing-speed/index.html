    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Typing Speed",
        "url": "https://onepagetoys.com/tools/typing-speed/",
        "description": "A typing speed test measuring words per minute and accuracy over a timed run, with a live speed trail, per-word review of every mistake, and your personal best kept in the browser.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript. Requires HTML5.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },

      }
    </script>
    <script>
      (function () {
        try {
          var m = localStorage.getItem("opt-theme");
          if (m !== "light" && m !== "dark" && m !== "system") m = "system";
          var dark = m === "dark" || (m === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var de = document.documentElement;
          de.setAttribute("data-theme", dark ? "dark" : "light");
          de.setAttribute("data-theme-mode", m);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=1" />
  </head>
  <body>
    <header class="topbar" aria-label="One Page Toys">
      <a class="brand" href="../../">
        <span class="brand__mark" aria-hidden="true"></span>
        <span>One Page Toys</span>
      </a>
      <div class="topbar__right">
        <span class="topbar__tag">No. 106 · Typing Speed</span>
        <button type="button" class="iconbtn theme-toggle" data-theme-toggle aria-label="Theme: System (click to change)" title="Theme: System">
          <span class="theme-toggle__auto" aria-hidden="true">◐</span>
          <span class="theme-toggle__sun" aria-hidden="true">☀</span>
          <span class="theme-toggle__moon" aria-hidden="true">☾</span>
        </button>
      </div>
    </header>

    <main class="stage">
      <section class="ts" aria-label="Typing speed test">
        <div class="hud">
          <div class="hud__cell">
            <span class="hud__k">WPM</span>
            <span class="hud__v" id="wpm">0</span>
          </div>
          <div class="hud__cell">
            <span class="hud__k">Accuracy</span>
            <span class="hud__v" id="acc">100%</span>
          </div>
          <div class="hud__cell">
            <span class="hud__k" id="clockK">Time</span>
            <span class="hud__v" id="clock">60</span>
          </div>
          <div class="hud__cell">
            <span class="hud__k">Best</span>
            <span class="hud__v" id="best">—</span>
          </div>
        </div>

        <canvas id="trail" class="trail" aria-hidden="true"></canvas>

        <div class="typebox" id="typebox" tabindex="0" role="textbox" aria-label="Typing area — start typing to begin">
          <div class="words" id="words"></div>
          <div class="caretHint" id="caretHint">Click here, then just start typing</div>
        </div>
        <!-- Real input, visually hidden: this is what actually receives keys, so
             mobile keyboards open and IME/autocorrect behave normally. -->
        <input id="sink" class="sink" autocomplete="off" autocorrect="off" autocapitalize="off"
               spellcheck="false" aria-label="Type here" />

        <div class="controls">
          <div class="seg" role="group" aria-label="Test length">
            <button type="button" class="seg__b is-on" data-secs="30">30s</button>
            <button type="button" class="seg__b" data-secs="60">60s</button>
            <button type="button" class="seg__b" data-secs="120">2m</button>
          </div>
          <button type="button" class="btn" id="restart">Restart</button>
        </div>

        <div class="result" id="result" hidden>
          <p class="result__eyebrow" id="resultEyebrow">Time</p>
          <h2 class="result__big"><span id="rWpm">0</span> <small>wpm</small></h2>
          <p class="result__line" id="resultLine"></p>
          <div class="result__grid" id="resultGrid"></div>
          <div class="result__actions">
            <button type="button" class="btn btn--primary" id="againBtn">Go again</button>
            <button type="button" class="btn" id="shareBtn">Share result</button>
          </div>
        </div>
      </section>

      <a class="backlink" href="../../">← onepagetoys.com</a>
    </main>
