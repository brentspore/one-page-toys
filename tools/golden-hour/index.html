    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

    <script>
      (function () {
        try {
          var m = localStorage.getItem("opt-theme");
          if (m !== "light" && m !== "dark" && m !== "system") m = "system";
          var dark = m === "dark" || (m === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var de = document.documentElement;
          de.setAttribute("data-theme", dark ? "dark" : "light");
          de.setAttribute("data-theme-mode", m);
        } catch (e) {}
      })();
    </script>

  <body>
    <header class="topbar" aria-label="One Page Toys">
      <a class="brand" href="../../">
        <span class="brand__mark" aria-hidden="true"></span>
        <span>One Page Toys</span>
      </a>
      <div class="topbar__right">
        <span class="topbar__tag">No. 105 · Golden Hour</span>
        <button type="button" class="iconbtn theme-toggle" data-theme-toggle aria-label="Theme: System (click to change)" title="Theme: System">
          <span class="theme-toggle__auto" aria-hidden="true">◐</span>
          <span class="theme-toggle__sun" aria-hidden="true">☀</span>
          <span class="theme-toggle__moon" aria-hidden="true">☾</span>
        </button>
      </div>
    </header>

    <main class="stage">
      <section class="gh" aria-label="Golden hour">
        <p class="eyebrow" id="eyebrow">Next golden hour</p>
        <h1 class="headline" id="countdown">—</h1>
        <p class="sub" id="subline">Finding your light…</p>

        <div class="ribbon" id="ribbon">
          <canvas id="band" class="ribbon__canvas" aria-label="The day drawn as a colour ribbon from night through golden hour to daylight" role="img"></canvas>
          <div class="ribbon__now" id="nowMark" hidden><span class="ribbon__grip"></span><span class="ribbon__lab" id="nowLab"></span></div>
          <div class="ribbon__ticks" id="ticks" aria-hidden="true"></div>
        </div>

        <ul class="legend" id="legend" aria-label="Light phases"></ul>

        <div class="times" id="times" role="group" aria-label="Sun times"></div>

        <div class="controls">
          <label class="place">
            <span class="place__k">Place</span>
            <select id="placeSel" aria-label="Choose a location"></select>
          </label>
          <button type="button" class="btn btn--primary" id="locBtn">Use my location</button>
        </div>
        <p class="note" id="note"></p>
      </section>

      <a class="backlink" href="../../">← onepagetoys.com</a>
    </main>
