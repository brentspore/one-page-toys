    <script>
      (function () {
        try {
          var m = localStorage.getItem("opt-theme");
          if (m !== "light" && m !== "dark" && m !== "system") m = "system";
          var dark = m === "dark" || (m === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var de = document.documentElement;
          de.setAttribute("data-theme", dark ? "dark" : "light");
          de.setAttribute("data-theme-mode", m);
        } catch (e) {}
      })();
    </script>

  <body>
    <header class="topbar" aria-label="One Page Toys">
      <a class="brand" href="../../">
        <span class="brand__mark" aria-hidden="true"></span>
        <span>One Page Toys</span>
      </a>
      <div class="topbar__right">
        <span class="topbar__tag">No. 104 · Moon Phase</span>
        <button type="button" class="iconbtn theme-toggle" data-theme-toggle aria-label="Theme: System (click to change)" title="Theme: System">
          <span class="theme-toggle__auto" aria-hidden="true">◐</span>
          <span class="theme-toggle__sun" aria-hidden="true">☀</span>
          <span class="theme-toggle__moon" aria-hidden="true">☾</span>
        </button>
      </div>
    </header>

    <main class="stage">
      <section class="mp" aria-label="Moon phase">
        <p class="eyebrow" id="eyebrow">Tonight's moon</p>
        <h1 class="headline" id="phaseName">—</h1>

        <div class="sky" id="sky">
          <canvas id="moon" class="sky__moon" aria-label="A drawing of the moon at the selected phase" role="img"></canvas>
          <p class="sky__hint" id="skyHint">Drag across the moon to travel through the days</p>
        </div>

        <div class="stats" role="group" aria-label="Moon details">
          <div class="stat">
            <span class="stat__k">Illuminated</span>
            <span class="stat__v" id="statLit">—</span>
          </div>
          <div class="stat">
            <span class="stat__k">Moon age</span>
            <span class="stat__v" id="statAge">—</span>
          </div>
          <div class="stat">
            <span class="stat__k">Distance</span>
            <span class="stat__v" id="statDist">—</span>
          </div>
        </div>

        <div class="scrub">
          <label class="scrub__lab" for="dayRange" id="dateLabel">Tonight</label>
          <input type="range" id="dayRange" min="-182" max="182" step="0.25" value="0"
                 aria-label="Days from today" />
          <div class="scrub__ends" aria-hidden="true"><span>6 months back</span><span>6 months on</span></div>
        </div>

        <div class="next">
          <div class="next__card">
            <span class="next__k">Next full moon</span>
            <span class="next__v" id="nextFull">—</span>
            <span class="next__sub" id="nextFullName"></span>
          </div>
          <div class="next__card">
            <span class="next__k">Next new moon</span>
            <span class="next__v" id="nextNew">—</span>
            <span class="next__sub" id="nextNewSub"></span>
          </div>
        </div>

        <div class="controls">
          <button type="button" class="btn btn--primary" id="todayBtn">Back to tonight</button>
          <label class="datepick">
            <span class="datepick__k">Any date</span>
            <input type="date" id="datePick" aria-label="Pick a date" />
          </label>
        </div>
      </section>

      <a class="backlink" href="../../">← onepagetoys.com</a>
    </main>
