    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Decision Wheel",
        "url": "https://onepagetoys.com/tools/decision-wheel/",
        "description": "A spinning decision wheel. Enter between two and twelve options, flick or press spin, and watch real angular physics carry the wheel past a ticking flapper until it settles on one answer. Wheels can be shared with a link.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript. Requires HTML5 Canvas.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "isPartOf": { "@type": "WebSite", "name": "One Page Toys", "url": "https://onepagetoys.com/" }
      }
    </script>
    <script>
      (function () {
        try {
          var m = localStorage.getItem("opt-theme");
          if (m !== "light" && m !== "dark" && m !== "system") m = "system";
          var dark = m === "dark" || (m === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var de = document.documentElement;
          de.setAttribute("data-theme", dark ? "dark" : "light");
          de.setAttribute("data-theme-mode", m);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=1" />

  <body>
    <header class="topbar" aria-label="One Page Toys">
      <a class="brand" href="../../">
        <span class="brand__mark" aria-hidden="true"></span>
        <span>One Page Toys</span>
      </a>
      <div class="topbar__right">
        <span class="topbar__tag">No. 097 · Decision Wheel</span>
        <button type="button" class="iconbtn" id="soundBtn" aria-pressed="true" aria-label="Sound on" title="Sound on">♪</button>
        <button type="button" class="iconbtn theme-toggle" data-theme-toggle aria-label="Theme: System (click to change)" title="Theme: System">
          <span class="theme-toggle__auto" aria-hidden="true">◐</span>
          <span class="theme-toggle__sun" aria-hidden="true">☀</span>
          <span class="theme-toggle__moon" aria-hidden="true">☾</span>
        </button>
      </div>
    </header>

    <main class="stage">
      <section class="wheelwrap" aria-label="Decision wheel">
        <div class="wheelbox">
          <canvas id="wheel" aria-label="Spinning decision wheel"></canvas>
        </div>

        <p class="verdict" id="verdict" role="status" aria-live="polite">Flick the wheel</p>

        <div class="actions">
          <button type="button" class="btn btn--primary" id="spinBtn">Spin</button>
          <button type="button" class="btn btn--ghost" id="shareBtn">Copy link</button>
        </div>
      </section>

      <section class="editor" aria-label="Wheel options">
        <div class="editor__head">
          <h2 class="editor__title">Options</h2>
          <div class="presets" id="presets" role="group" aria-label="Preset wheels"></div>
        </div>
        <ul class="opts" id="opts"></ul>
        <div class="editor__foot">
          <button type="button" class="btn btn--add" id="addBtn">+ Add option</button>
          <span class="count" id="count">6 of 12</span>
        </div>
      </section>

      <a class="backlink" href="../../">← onepagetoys.com</a>
    </main>

    <script src="../../assets/tickets.js?v=18" defer></script>
    <script src="../../assets/prizes.js?v=1" defer></script>
