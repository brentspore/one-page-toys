# Local dev: nginx over the LIVE working tree. Edit a file, reload the page —
# no rebuild. (The Dockerfile bakes a copy instead, for a standalone image.)
#
#   docker compose up -d        -> http://localhost:8080
#   docker compose down
services:
  web:
    image: nginx:1.27-alpine
    container_name: one-page-toys
    ports:
      - "8080:8080"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
